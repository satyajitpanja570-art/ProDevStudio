<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfield Animation - Black Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.8);
            animation: fadeInOut 4s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #888;
            font-size: 12px;
            text-align: right;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="title">✨ Starfield Magic ✨</div>
    <div class="info">
        <p>Animated Hands & Stars</p>
        <p>Black Screen Animation</p>
    </div>

    <script>
        // ============================================
        // STARFIELD & HAND ANIMATION
        // ============================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ============================================
        // STAR CLASS
        // ============================================
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * canvas.width;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 1.5;
                this.brightness = Math.random() * 0.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z -= 2;
                this.twinklePhase += this.twinkleSpeed;

                // Wrap around screen
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.z <= 0) {
                    this.z = canvas.width;
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                }
            }

            draw() {
                const perspectiveX = (this.x - canvas.width / 2) * (canvas.width / this.z) + canvas.width / 2;
                const perspectiveY = (this.y - canvas.height / 2) * (canvas.width / this.z) + canvas.height / 2;
                const perspectiveSize = (this.size * canvas.width) / this.z;

                // Twinkle effect
                const twinkle = Math.sin(this.twinklePhase) * 0.5 + 0.5;
                const opacity = this.brightness * twinkle;

                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.shadowColor = `rgba(100, 200, 255, ${opacity})`;
                ctx.shadowBlur = perspectiveSize * 2;
                ctx.fillRect(
                    perspectiveX - perspectiveSize / 2,
                    perspectiveY - perspectiveSize / 2,
                    perspectiveSize,
                    perspectiveSize
                );
            }
        }

        // ============================================
        // HAND CLASS
        // ============================================
        class Hand {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.size = Math.random() * 20 + 15;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.floatPhase = Math.random() * Math.PI * 2;
                this.floatSpeed = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.floatPhase += this.floatSpeed;

                // Floating motion
                const floatY = Math.sin(this.floatPhase) * 3;
                this.y += floatY * 0.1;

                // Bounce off walls
                if (this.x > canvas.width + 50) this.x = -50;
                if (this.x < -50) this.x = canvas.width + 50;
                if (this.y > canvas.height + 50) this.y = -50;
                if (this.y < -50) this.y = canvas.height + 50;

                // Occasional direction change
                if (Math.random() < 0.002) {
                    this.vx += (Math.random() - 0.5) * 2;
                    this.vy += (Math.random() - 0.5) * 2;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#00ffff';
                ctx.strokeStyle = '#00aaff';
                ctx.lineWidth = 1;
                ctx.shadowColor = 'rgba(0, 255, 255, 0.8)';
                ctx.shadowBlur = 15;

                // Draw hand shape (simplified)
                ctx.beginPath();
                // Palm
                ctx.ellipse(0, 0, this.size * 0.4, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Thumb
                ctx.beginPath();
                ctx.arc(this.size * 0.2, 0, this.size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Fingers
                for (let i = 0; i < 4; i++) {
                    const angle = (i - 1.5) * 0.4;
                    const fx = Math.cos(angle) * this.size * 0.5;
                    const fy = Math.sin(angle) * this.size * 0.6 - this.size * 0.3;
                    ctx.beginPath();
                    ctx.arc(fx, fy, this.size * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // ============================================
        // INITIALIZE PARTICLES
        // ============================================
        const stars = [];
        const hands = [];

        for (let i = 0; i < 150; i++) {
            stars.push(new Star());
        }

        for (let i = 0; i < 5; i++) {
            hands.push(new Hand());
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Update and draw hands
            hands.forEach(hand => {
                hand.update();
                hand.draw();
            });

            ctx.globalAlpha = 1;
            requestAnimationFrame(animate);
        }

        animate();

        // ============================================
        // RESIZE HANDLER
        // ============================================
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ============================================
        // MOUSE INTERACTION
        // ============================================
        document.addEventListener('mousemove', (e) => {
            // Add extra hands at mouse position occasionally
            if (Math.random() < 0.1) {
                const hand = new Hand();
                hand.x = e.clientX;
                hand.y = e.clientY;
                hand.vx = (Math.random() - 0.5) * 4;
                hand.vy = (Math.random() - 0.5) * 4;
                hands.push(hand);

                if (hands.length > 15) {
                    hands.shift();
                }
            }
        });

        // ============================================
        // CLICK TO CREATE BURST
        // ============================================
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 8; i++) {
                const hand = new Hand();
                hand.x = e.clientX;
                hand.y = e.clientY;
                hand.vx = (Math.random() - 0.5) * 6;
                hand.vy = (Math.random() - 0.5) * 6;
                hand.size *= 1.3;
                hands.push(hand);
            }

            for (let i = 0; i < 30; i++) {
                const star = new Star();
                star.x = e.clientX;
                star.y = e.clientY;
                star.vx = (Math.random() - 0.5) * 5;
                star.vy = (Math.random() - 0.5) * 5;
                stars.push(star);
            }
        });
    </script>
</body>
</html>
